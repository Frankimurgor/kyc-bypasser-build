name: Build KYC Bypasser APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''

    - name: Install NDK
      run: |
        yes | sdkmanager --licenses
        sdkmanager --install "ndk;26.1.10909125"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        if [ -f "gradlew" ]; then
          # Pass the NDK version directly to Gradle instead of modifying the file
          ./gradlew assembleDebug -PndkVersion="26.1.10909125" --stacktrace
        elif [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          ./gradlew assembleDebug -PndkVersion="26.1.10909125" --stacktrace
        else
          gradle assembleDebug -PndkVersion="26.1.10909125" --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk