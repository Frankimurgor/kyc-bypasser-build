name: Build KYC Bypasser APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''

    - name: Install NDK and accept licenses
      run: |
        yes | sdkmanager --licenses
        sdkmanager --install "ndk;26.1.10909125"
        echo "ndkVersion = \"26.1.10909125\"" >> app/build.gradle.kts

    # NEW STEP: Find where gradlew actually is
    - name: Locate and Grant permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} \;

    # NEW STEP: Build using the located gradlew script
    - name: Build Debug APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        elif [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          # If the wrapper is in a subfolder, usually root
          ./gradlew assembleDebug --stacktrace
        else
          # Fallback to system gradle if wrapper is completely missing
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk